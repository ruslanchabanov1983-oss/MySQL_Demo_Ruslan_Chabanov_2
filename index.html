<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADU • Live Pulse Board — Chabanov Ruslan Alievich</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #06080f;
      color: #f8fafc;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
      position: relative;
    }

    /* Комбинированный фон: Aurora + Tech Grid + Световые импульсы */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(99, 102, 241, 0.25), transparent),
        radial-gradient(ellipse 60% 45% at 85% 90%, rgba(6, 182, 212, 0.18), transparent),
        radial-gradient(ellipse 50% 40% at 10% 75%, rgba(168, 85, 247, 0.16), transparent);
    }

    .tech-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(circle at 50% 35%, black 35%, transparent 85%);
      -webkit-mask-image: radial-gradient(circle at 50% 35%, black 35%, transparent 85%);
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      will-change: transform;
      animation: floatSlow 18s ease-in-out infinite alternate;
    }

    .orb-left {
      width: 360px;
      height: 360px;
      background: rgba(79, 70, 229, 0.28);
      top: 5%;
      left: -6%;
    }

    .orb-right {
      width: 340px;
      height: 340px;
      background: rgba(14, 165, 233, 0.22);
      bottom: 8%;
      right: -5%;
      animation-delay: -7s;
    }

    @keyframes floatSlow {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(30px, -25px, 0); }
    }

    .beam {
      position: absolute;
      width: 1px;
      height: 140px;
      background: linear-gradient(to bottom, transparent, rgba(56, 189, 248, 0.65), transparent);
      opacity: 0;
      animation: beamDrop 7s linear infinite;
    }

    .beam-1 { left: 18%; animation-delay: 0s; }
    .beam-2 { left: 52%; animation-delay: 2.5s; }
    .beam-3 { left: 82%; animation-delay: 4.8s; }

    @keyframes beamDrop {
      0% { top: -150px; opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { top: 105%; opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .nav-pill {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 999px;
      margin-bottom: 28px;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: #f1f5f9;
    }

    .pulse-ring {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 12px #10b981;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sync-tag {
      font-size: 11px;
      color: #34d399;
      font-weight: 600;
    }

    .admin-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #e2e8f0;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .admin-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .admin-btn.active {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      color: #6ee7b7;
    }

    .hero {
      text-align: center;
      margin-bottom: 20px;
    }

    .uni-chip {
      display: inline-flex;

      background: rgba(99, 102, 241, 0.16);
      border: 1px solid rgba(129, 140, 248, 0.32);
      color: #a5b4fc;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 14px;
    }

    h1 {

      letter-spacing: -0.5px;

      margin-bottom: 10px;

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 14.5px;
      color: #94a3b8;
      max-width: 460px;
      margin: 0 auto 16px;
      line-height: 1.5;
    }

    .creator-card {

      padding: 12px 16px;

    .creator-avatar {

      border-radius: 12px;

      color: #fff;

    .creator-meta {
      text-align: left;
    }

    .creator-label {
      font-size: 11px;
      text-transform: uppercase;

      color: #38bdf8;

    .creator-name {

    .composer-card {

    .role-selector {
      display: flex;

    }

    .role-pill {
      padding: 6px 12px;

      background: rgba(255, 255, 255, 0.04);

      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .role-pill:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .role-pill.selected {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.35), rgba(6, 182, 212, 0.35));
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.25);
    }

    .input-wrap {
      position: relative;
      margin-bottom: 12px;
    }

    textarea {
      width: 100%;
      min-height: 78px;
      resize: none;
      padding: 14px 16px 28px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(6, 8, 15, 0.88);
      color: #ffffff;
      font-size: 15px;
      line-height: 1.45;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    textarea::placeholder {
      color: #64748b;
    }

    textarea:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.22);
    }

    .char-counter {
      position: absolute;
      bottom: 8px;
      right: 12px;
      font-size: 11px;
      color: #64748b;
    }

    .send-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 28px rgba(99, 102, 241, 0.35);
    }

    .send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(6, 182, 212, 0.45);
    }

    .send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .feed-controls {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;

    }

    .feed-stats {
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
    }

    .feed-stats span {
      color: #38bdf8;
      font-weight: 800;
    }

    .controls-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .refresh-btn {
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #7dd3fc;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .refresh-btn:hover {
      background: rgba(56, 189, 248, 0.16);
    }

    .sort-tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 999px;
      padding: 3px;
    }

    .sort-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .sort-btn.active {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }

    .feed-list {
      width: 100%;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;

    }

    .post-card {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 20px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .post-card:hover {
      border-color: rgba(56, 189, 248, 0.42);
      transform: translateY(-2px);
    }

    .post-header {
      display: flex;
      justify-content: space-between;

      gap: 10px;
    }

    .author-left {
      display: flex;

      gap: 10px;
    }

    .mini-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;

    .role-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      letter-spacing: 0.3px;
    }

    .role-att { background: rgba(56, 189, 248, 0.16); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.3); }
    .role-other { background: rgba(168, 85, 247, 0.16); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.3); }
    .role-ustoz { background: rgba(245, 158, 11, 0.18); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.35); }
    .role-guest { background: rgba(16, 185, 129, 0.16); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }

    .post-time {
      font-size: 11.5px;
      color: #64748b;
    }

    .post-body {
      font-size: 15.5px;
      color: #f8fafc;
      line-height: 1.5;
      word-break: break-word;
    }

    .post-footer {

    .country-tag {

    .reactions-row {

    .react-btn {
      display: inline-flex;

      gap: 5px;

    .react-btn:hover {

      font-size: 11.5px;

    }

    .del-btn:hover {
